name: Playwright Tests

# Kapan workflow ini dijalankan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Jalankan test E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Ambil kode dari repo ke mesin virtual.
      - name: Checkout kode
        uses: actions/checkout@v4

      # 2. Pasang Node.js. cache:npm mempercepat run berikutnya.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependensi persis sesuai package-lock.json.
      - name: Install dependensi
        run: npm ci

      # 4. Unduh browser. --with-deps memasang library sistem yang dibutuhkan Linux.
      - name: Install browser Playwright
        run: npx playwright install --with-deps chromium

      # 5. Jalankan test. http-server dinyalakan otomatis oleh config.
      - name: Jalankan Playwright
        run: npx playwright test

      # 6. Simpan laporan agar bisa diunduh, termasuk saat test gagal.
      - name: Unggah laporan
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
